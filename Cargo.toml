[package]
name = "poker-lab"
version = "0.1.0"
edition = "2024"
default-run = "poker-lab"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "sync", "signal", "macros"] }
libc = "0.2"

[workspace]
members = ["table"]
